# Terraform: plan on every PR (summary posted as a PR comment), apply on main behind a protected environment.
# After copying: adjust paths/working-directory, keep ONE cloud login block, then run `pin-actions --write`.
# Repo setup: create environment "production" with required reviewers; store role IDs as repository/environment *variables*.
name: terraform

on:
  pull_request:
    paths: ["infra/**", ".github/workflows/terraform.yml"]
  push:
    branches: [main]
    paths: ["infra/**", ".github/workflows/terraform.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write        # OIDC
      pull-requests: write   # PR comment
    defaults:
      run:
        working-directory: infra
    outputs:
      exitcode: ${{ steps.plan.outputs.exitcode }}
    steps:
      - uses: actions/checkout@LATEST
      - uses: hashicorp/setup-terraform@LATEST
        with:
          terraform_wrapper: false

      # --- Cloud login via OIDC: keep exactly one block (use a read-only role for plan) ---
      # - uses: aws-actions/configure-aws-credentials@LATEST
      #   with:
      #     role-to-assume: ${{ vars.TF_PLAN_ROLE_ARN }}
      #     aws-region: ${{ vars.AWS_REGION }}
      # - uses: azure/login@LATEST
      #   with:
      #     client-id: ${{ vars.AZURE_CLIENT_ID }}
      #     tenant-id: ${{ vars.AZURE_TENANT_ID }}
      #     subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      # - uses: google-github-actions/auth@LATEST
      #   with:
      #     workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
      #     service_account: ${{ vars.GCP_PLAN_SA }}

      - run: terraform init -lockfile=readonly
      - run: terraform fmt -check -recursive
      - run: terraform validate -no-color

      - id: plan
        run: |
          set +e
          terraform plan -out=tfplan -no-color -detailed-exitcode > plan.log 2>&1
          ec=$?
          cat plan.log
          echo "exitcode=$ec" >> "$GITHUB_OUTPUT"
          [ "$ec" -ne 1 ]   # 0 = no changes, 2 = changes, 1 = error

      - name: Upload plan (may contain sensitive values, keep retention short)
        if: steps.plan.outputs.exitcode == '2'
        uses: actions/upload-artifact@LATEST
        with:
          name: tfplan
          path: infra/tfplan
          retention-days: 3

      - name: Comment plan summary on PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          {
            echo "### Terraform plan"
            echo '```'
            grep -E '^\s*# .* (will be|must be)|^Plan:|^No changes' plan.log | head -n 150
            echo '```'
          } > comment.md
          gh pr comment "$PR" --body-file comment.md --edit-last || gh pr comment "$PR" --body-file comment.md

  apply:
    needs: plan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.plan.outputs.exitcode == '2'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production   # required reviewers approve after reading the plan job log
    concurrency:
      group: terraform-apply-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@LATEST
      - uses: hashicorp/setup-terraform@LATEST
        with:
          terraform_wrapper: false
      # --- Same cloud login block as above, but with the apply role (e.g. vars.TF_APPLY_ROLE_ARN) ---
      - uses: actions/download-artifact@LATEST
        with:
          name: tfplan
          path: infra
      - run: terraform init -lockfile=readonly
      - run: terraform apply -input=false tfplan
